## **.github/workflows/ci.yaml**

name: CI - Continuous Integration

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly tests on Sunday at 3 AM
    - cron: '0 3 * * 0'
  workflow_dispatch:  # Allow manual trigger

jobs:
  # Job 1: Test + lint + coverage on supported Python versions
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-latest` is Ubuntu 26.04, and actions/setup-python has no
        # Python 3.9 build for it ("The version '3.9' with architecture 'x64'
        # was not found for Ubuntu 26.04"). The oldest interpreter the package
        # declares support for is therefore tested on 22.04, where a build
        # exists; dropping it from the matrix instead would quietly make
        # `requires-python = ">=3.9"` a claim nothing verifies.
        include:
          - os: ubuntu-22.04
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libnotify-bin feh xvfb \
          libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # gesso-sdk is required at import time but is not on PyPI yet, so it
        # cannot be declared in pyproject.toml without breaking the publish
        # job. Install it from source, then the package itself.
        pip install "gesso-sdk @ git+https://github.com/QHaidry/gesso@main"
        pip install -e .[dev]

    - name: Lint with flake8 (advisory, non-gating)
      run: |
        flake8 src/ --count --statistics --show-source --max-line-length=100
      continue-on-error: true

    - name: Check formatting with black (advisory, non-gating)
      run: |
        black --check src/ --line-length=100
      continue-on-error: true

    - name: Type check with mypy (advisory, non-gating)
      run: |
        mypy
      continue-on-error: true

    - name: Run tests with pytest (the release gate)
      run: |
        pytest tests/ -v --cov=muralis --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov
        fail_ci_if_error: false

  # Job 2: Package and build
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build wheel twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/
        retention-days: 30

  # Job 3: Integration tests with X11 virtual display
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        # The Qt runtime libraries are needed even though these tests do not
        # open a window: pytest-qt is installed via the dev extra and imports
        # PySide6.QtGui while configuring the session, which fails at import
        # time with "libEGL.so.1: cannot open shared object file".
        sudo apt-get install -y xvfb x11-utils libnotify-bin feh \
          libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
        pip install "gesso-sdk @ git+https://github.com/QHaidry/gesso@main"
        pip install -e .[dev]

    - name: Run integration tests with Xvfb
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 &
        sleep 3
        pytest tests/integration/ -v --tb=short

  # Job 4: Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'

    - name: Upload Trivy results to GitHub Security tab (non-gating)
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  # Job 5: Documentation build
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install docs dependencies
      run: |
        pip install -e .[docs] pymdown-extensions

    - name: Build documentation
      run: |
        mkdocs build --strict

  # Job 6: Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, build, integration, security]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-packages
        path: dist/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 7: Publish to PyPI (trusted publishing)
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/muralis
    permissions:
      id-token: write  # For trusted publishing

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-packages
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

